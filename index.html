<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23161a22'/%3E%3Cpath fill='%238fdc9f' d='M2 1h4v2H2zM1 3h6v3H1zM2 6h1v1H2zM5 6h1v1H5z'/%3E%3C/svg%3E" />
  <title>僵尸竞技场</title>
  <style>
    * { box-sizing: border-box; }

      font-family: ui-monospace, "Cascadia Code", Consolas, monospace; overflow: hidden; }
    #app { position: relative; width: 960px; height: 640px; margin: 0 auto; }
    canvas { display: block; image-rendering: pixelated; background: #161a22; }
    #overlay { position: absolute; inset: 0; pointer-events: none; }
    #overlay > * { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game" width="960" height="640"></canvas>
    <div id="overlay"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
